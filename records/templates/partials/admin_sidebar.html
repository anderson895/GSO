{% load static %}
<style>
    .sidebar { padding: 24px 18px 0; background: linear-gradient(180deg, #14512a 0%, #0f4119 42%, #0e4118 100%); color: #d7ead9; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; overflow-x: hidden; }
    .sidebar-top { display: flex; align-items: center; }
    @media (min-width: 761px) {
        .sidebar { position: sticky; top: 0; height: 100vh; }
    }
    .sidebar-top .sidebar-burger { margin-left: 0; margin-right: auto; background: transparent; border: none; color: #d7ead9; cursor: pointer; padding: 4px; display: inline-flex; border-radius: 8px; transition: background .2s ease; }
    .sidebar-top .sidebar-burger:hover { background: rgba(255,255,255,0.1); }
    .sidebar .brand { display: flex; align-items: center; gap: 10px; font-size: initial; font-weight: initial; }
    .sidebar .brand img { width: 82px; height: 82px; border-radius: 0; background: transparent; padding: 0; object-fit: contain; flex-shrink: 0; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.16; }
    .brand-text .b-uni { font-size: 0.64rem; color: #bcdcc2; font-weight: 500; white-space: nowrap; }
    .brand-text .b-gso { font-size: 2.4rem; font-weight: 800; color: #fff; letter-spacing: .5px; }
    .brand-text .b-sys { font-size: 0.64rem; color: #cfe6d3; font-weight: 500; white-space: nowrap; }
    .sidebar .section-title { color: #7fae86; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.16em; font-weight: 700; margin-bottom: -4px; }
    .sidebar .nav-links { display: grid; gap: 6px; }
    .sidebar .nav-links a { display: flex; justify-content: flex-start; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 12px; text-decoration: none; color: #d7ead9; background: transparent; font-weight: 500; font-size: 0.97rem; transform: none; transition: background .2s ease, color .2s ease; }
    .sidebar .nav-links a .nav-ico { display: inline-flex; width: 22px; justify-content: center; flex-shrink: 0; }
    .sidebar .nav-links a .nav-label { flex: 1; }
    .sidebar .nav-links a .nav-chev { opacity: .65; display: inline-flex; }
    .sidebar .nav-links a:hover { background: rgba(255,255,255,0.09); transform: none; }
    .sidebar .nav-links a.active { background: #ffffff; color: #17612b; font-weight: 700; transform: none; box-shadow: 0 8px 20px rgba(0,0,0,0.14); }
    .sidebar .nav-links a.active .nav-chev { display: none; }
    .sidebar-divider { height: 1px; background: rgba(255,255,255,0.13); margin: 6px 4px; }
    .sidebar-deco { margin-top: auto; margin-left: -18px; margin-right: -18px; }
    .sidebar-deco img { display: block; width: 100%; }
    .sidebar .logout-btn { display: flex; justify-content: flex-start; align-items: center; gap: 14px; width: 100%; padding: 13px 16px; border-radius: 12px; border: none; background: transparent; color: #d7ead9; cursor: pointer; font-family: inherit; font-size: 0.97rem; font-weight: 500; text-align: left; transform: none; transition: background 0.2s ease; }
    .sidebar .logout-btn .nav-ico { display: inline-flex; width: 22px; justify-content: center; flex-shrink: 0; }
    .sidebar .logout-btn:hover { background: rgba(255, 255, 255, 0.09); transform: none; }
    /* reset leaked .brand span box styling from legacy page CSS */
    .sidebar .brand-text span { width: auto; height: auto; background: transparent; border-radius: 0; display: inline; place-items: normal; }
    /* clean icon-rail collapse */
    .layout.sidebar-collapsed .sidebar { width: 84px; min-width: 84px; padding: 24px 10px 0; }
    .layout.sidebar-collapsed .sidebar .brand { justify-content: center; }
    .layout.sidebar-collapsed .sidebar .brand img { width: 46px; height: 46px; }
    .layout.sidebar-collapsed .sidebar .brand-text,
    .layout.sidebar-collapsed .sidebar .section-title,
    .layout.sidebar-collapsed .sidebar .nav-label,
    .layout.sidebar-collapsed .sidebar .nav-chev,
    .layout.sidebar-collapsed .sidebar .nav-badge,
    .layout.sidebar-collapsed .sidebar .sidebar-divider,
    .layout.sidebar-collapsed .sidebar .sidebar-deco { display: none !important; }
    .layout.sidebar-collapsed .sidebar .nav-links { display: grid !important; }
    .layout.sidebar-collapsed .sidebar form { display: block !important; }
    .layout.sidebar-collapsed .sidebar .logout-btn { display: flex !important; justify-content: center; }
    .layout.sidebar-collapsed .sidebar .nav-links a { justify-content: center; padding: 13px 0; }
</style>

<aside class="sidebar" id="app-sidebar">

    <div class="sidebar-top">
        <button type="button" class="sidebar-burger sidebar-collapse" aria-label="Toggle sidebar">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
    </div>


    <div class="brand">
        <img src="{% static 'images/bsu-emblem.png' %}" alt="BSU Logo">
        <div class="brand-text">
            <span class="b-uni">Bulacan State University&rsquo;s</span>
            <span class="b-gso">GSO</span>
            <span class="b-sys">Waste Management System</span>
        </div>
    </div>

    <div class="section-title">Main Menu</div>

    <div class="nav-links">
        <a href="{% url 'admin_dashboard' %}"{% if active == 'dashboard' %} class="active"{% endif %}>
            <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 16v-4M12 16v-7M16 16v-2"/></svg></span>
            <span class="nav-label">Dashboard</span>
            <span class="nav-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>
        <a href="{% url 'user_list' %}"{% if active == 'users' %} class="active"{% endif %}>
            <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="2.3"/><circle cx="6.5" cy="9.5" r="2"/><circle cx="17.5" cy="9.5" r="2"/><path d="M8 17c0-2.2 1.8-4 4-4s4 1.8 4 4"/><path d="M3 16.5c.1-1.8 1.4-3.2 3.2-3.4"/><path d="M21 16.5c-.1-1.8-1.4-3.2-3.2-3.4"/></svg></span>
            <span class="nav-label">User Management</span>
            <span class="nav-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>
        <a href="{% url 'area_list' %}"{% if active == 'areas' %} class="active"{% endif %}>
            <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h10v9H3z"/><path d="M13 9h4l3 3v3h-7z"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/></svg></span>
            <span class="nav-label">Area Management</span>
            <span class="nav-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>
        <a href="{% url 'admin_reports' %}"{% if active == 'reports' %} class="active"{% endif %}>
            <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>
            <span class="nav-label">Reports Summary</span>
            <span class="nav-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>
        <a href="{% url 'threshold_settings' %}"{% if active == 'threshold' %} class="active"{% endif %}>
            <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 12l4-3"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></span>
            <span class="nav-label">Threshold Settings</span>
            <span class="nav-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>
        <a href="{% url 'response_guidelines' %}"{% if active == 'response' %} class="active"{% endif %}>
            <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h11a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M8.5 4v15"/></svg></span>
            <span class="nav-label">Response Guidelines</span>
            <span class="nav-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>
        <a href="{% url 'audit_log' %}"{% if active == 'audit_log' %} class="active"{% endif %}>
            <span class="nav-ico">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="3" width="14" height="18" rx="2"/>
                    <path d="M9 8h6M9 12h6M9 16h4"/>
                </svg>
            </span>
            <span class="nav-label">Audit Log</span>
            <span class="nav-chev">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 6l6 6-6 6"/>
                </svg>
            </span>
        </a>
    </div>

    <div class="sidebar-divider"></div>

    <div class="section-title">Account</div>

    <div class="nav-links">
        <a href="{% url 'edit_profile' %}"{% if active == 'profile' %} class="active"{% endif %}>
            <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg></span>
            <span class="nav-label">Profile Settings</span>
        </a>
    </div>

    <form action="{% url 'logout' %}" method="POST" style="width:100%;">
        {% csrf_token %}
        <button type="submit" class="logout-btn">
            <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h3"/><path d="M14 8l4 4-4 4"/><path d="M8 12h10"/></svg></span>
            <span class="nav-label">Logout</span>
        </button>
    </form>

    <div class="sidebar-deco">
        <img src="{% static 'images/sidebar-deco.png' %}" alt="">
    </div>

</aside>
